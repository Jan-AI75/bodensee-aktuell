<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f2f5f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bodensee" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Bodensee aktuell</title>
    <script>
      /* Farbschema vor dem ersten Zeichnen setzen, damit nichts aufblitzt */
      (function () {
        var p = "auto"; try { p = localStorage.getItem("pegel-kn-palette") || p } catch (e) {}
        p = { graphit: "dunkel", marine: "dunkel", schwarz: "dunkel" }[p] || p
        var dark = p === "auto" ? matchMedia("(prefers-color-scheme: dark)").matches : p !== "hell"
        if (dark) document.documentElement.classList.add("dark")
        if (p === "nachtsee" || p === "nacht") document.documentElement.dataset.palette = p
        var bg = { nachtsee: "#0b1a20", nacht: "#070303" }[p] || (dark ? "#0e1316" : "#f2f5f6")
        document.querySelector('meta[name="theme-color"]').setAttribute("content", bg)
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-CMoS_NTd.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B5SrcmXR.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Service Worker (sw.js im Hauptordner): installierbar, prüft Seite und Daten immer beim Server nach */
      if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(function () {})
    </script>
  </body>
</html>
