name: Pegeldaten aktualisieren
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wasserstand Konstanz (PEGELONLINE)
        continue-on-error: true
        run: |
          curl -fsS --retry 3 "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/aa9179c1-17ef-4c61-a48a-74193fa7bfdf/W/measurements.json?start=P31D" -o data.tmp
          python3 -c "import json;d=json.load(open('data.tmp'));assert len(d)>100" && mv data.tmp data.json
      - name: Wassertemperatur Lindau (GKD Bayern)
        continue-on-error: true
        env:
          TZ: Europe/Berlin
        run: python3 scripts/update_temp.py
      - name: Wasserstand-Historie (Lindau, auf Konstanz umgerechnet)
        continue-on-error: true
        run: python3 scripts/update_wl_hist.py
      - name: Ausblick (Vorhersage BAFU, Wetter Open-Meteo)
        continue-on-error: true
        run: python3 scripts/update_outlook.py
      - name: Speichern
        run: |
          rm -f data.tmp
          git config user.name "pegel-bot"
          git config user.email "pegel-bot@users.noreply.github.com"
          git add data.json temp.json wl_hist.json outlook.json
          git diff --cached --quiet || (git commit -m "Daten $(date -u +%FT%TZ)" && git push)
