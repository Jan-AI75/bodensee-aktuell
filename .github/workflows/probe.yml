name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out5
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          curl -sSL -A "$UA" "https://www.daten-bw.de/ckan/api/3/action/package_show?id=bodensee-pegelstand-konstanz" -o out5/ckan.json || true
          curl -sSL "https://api.existenz.ch/apiv1/hydro/daterange?locations=2032&parameters=height&startdate=2025-10-20&enddate=2025-11-03&app=pegelkn" -o out5/rom_2025.json || true
          curl -sSL "https://api.existenz.ch/apiv1/hydro/daterange?locations=2032&parameters=height&startdate=2026-09-26&enddate=2026-10-27&app=pegelkn" -o out5/rom_2026.json || true
          curl -sSI -H "Origin: https://jan-ai75.github.io" "https://api.existenz.ch/apiv1/hydro/daterange?locations=2032&parameters=height&startdate=2025-10-26&enddate=2025-10-27" -o out5/cors.txt || true
          ls -la out5
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out5 && git commit -m probe-results && git push
