name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out12
          python3 scripts/update_weather.py && mv weather.json out12/
          ls -la out12
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out12 && git commit -m probe-results && git push
