name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out9
          python3 scripts/update_outlook.py && mv outlook.json out9/
          ls -la out9
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out9 && git commit -m probe-results && git push
