name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out10
          curl -sSL "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_lakes_europe.geojson" -o /tmp/eu.geojson || true
          curl -sSL "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_lakes.geojson" -o /tmp/all.geojson || true
          python3 - <<'PY'
          import json
          out=[]
          for f in ['/tmp/eu.geojson','/tmp/all.geojson']:
              try: d=json.load(open(f))
              except Exception as e: print(f,e); continue
              for ft in d['features']:
                  pr=ft['properties']; g=ft['geometry']
                  txt=json.dumps(pr,ensure_ascii=False)
                  if any(k in txt for k in ['Constance','Bodensee','Konstanz','Untersee']):
                      out.append({'file':f,'props':{k:pr.get(k) for k in ['name','name_de','name_en','featurecla','scalerank']},'geometry':g})
                      continue
                  # Bounding-Box-Check
                  def pts(c):
                      if isinstance(c[0],(int,float)): yield c
                      else:
                          for x in c: yield from pts(x)
                  try:
                      P=list(pts(g['coordinates']))
                      lx=sum(p[0] for p in P)/len(P); ly=sum(p[1] for p in P)/len(P)
                      if 8.8<lx<9.8 and 47.4<ly<47.9: out.append({'file':f,'props':{k:pr.get(k) for k in ['name','name_de','name_en','featurecla','scalerank']},'geometry':g})
                  except Exception: pass
          json.dump(out,open('out10/constance.json','w'))
          print(len(out),[o['props'] for o in out])
          PY
          ls -la out10
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out10 && git commit -m probe-results && git push
