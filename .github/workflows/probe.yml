name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out3
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          G=https://www.gkd.bayern.de/de/seen/wassertemperatur/bayern/lindau-20001001
          curl -sSL -A "$UA" "$G/tagesmittelwerte/tabelle?beginn=01.01.1990&ende=27.10.2026" -o out3/tmw_all.html || true
          curl -sSL -A "$UA" "$G/messwerte/tabelle?beginn=25.09.2026&ende=27.10.2026" -o out3/mw_31.html || true
          curl -sSL -A "$UA" "$G/stammdaten" -o out3/stamm.html || true
          curl -sSL -A "$UA" "$G/download" -o out3/download.html || true
          ls -la out3
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out3 && git commit -m probe-results && git push
