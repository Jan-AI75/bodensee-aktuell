name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out6
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          G=https://www.gkd.bayern.de/de/seen/wasserstand/bayern/lindau-20001001
          curl -sSL -A "$UA" "$G/messwerte/tabelle?beginn=26.09.2026&ende=27.10.2026" -o out6/lin_daily_2026.html || true
          curl -sSL -A "$UA" "$G/messwerte/tabelle?beginn=01.01.1990&ende=27.10.2026" -o out6/lin_all.html || true
          curl -sSL -A "$UA" "$G/messwerte/tabelle" -o out6/lin_15min.html || true
          curl -sSL -A "$UA" "$G/stammdaten" -o out6/lin_stamm.html || true
          curl -sS "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/aa9179c1-17ef-4c61-a48a-74193fa7bfdf/W/measurements.json?start=P31D" -o out6/kn.json || true
          ls -la out6
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out6 && git commit -m probe-results && git push
