name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out15
          python3 scripts/update_weather.py && mv weather.json out15/
          for m in icon_d2 meteoswiss_icon_ch1; do curl -sS "https://api.open-meteo.com/v1/forecast?latitude=47.535,47.5455&longitude=9.66,9.6829&current=temperature_2m&models=$m&timezone=Europe%2FBerlin" -o out15/$m.json || true; done
          ls -la out15
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out15 && git commit -m probe-results && git push
