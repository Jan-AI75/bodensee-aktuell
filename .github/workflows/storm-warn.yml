name: Sturmwarnung prüfen
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warnstatus lesen (nur bei Änderung speichern)
        run: python3 scripts/update_warn.py
      - name: Speichern
        run: |
          git config user.name "pegel-bot"
          git config user.email "pegel-bot@users.noreply.github.com"
          git add warn.json
          git diff --cached --quiet || (git commit -m "Sturmwarnung geändert $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
