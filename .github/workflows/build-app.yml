name: App bauen
# Baut die React-App aus app/ und legt index.html und assets/ in den Hauptordner,
# den GitHub Pages ausliefert. Die Daten-JSONs bleiben unberührt.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Bauen
        working-directory: app
        run: npm run build
      - name: In den Hauptordner legen
        run: |
          rm -rf assets
          cp app/dist/index.html index.html
          cp -r app/dist/assets assets
      - name: Speichern
        run: |
          git config user.name "pegel-bot"
          git config user.email "pegel-bot@users.noreply.github.com"
          git add index.html assets
          git diff --cached --quiet || (git commit -m "App gebaut $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
